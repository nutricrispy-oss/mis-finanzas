<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mis Finanzas By CR</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f9d73"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#1b2430;--mu:#6b7686;--pr:#0f9d73;--bd:#e4e8ed;--wa:#d99a00;--er:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--cd:#18202a;--tx:#e8edf3;--mu:#8f9aa8;--bd:#263140}}
:root[data-theme="dark"]{--bg:#0f141a;--cd:#18202a;--tx:#e8edf3;--mu:#8f9aa8;--bd:#263140}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#v{max-width:640px;margin:0 auto;padding:14px 14px 100px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:13px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}.m{color:var(--mu);font-size:13px}.b{font-weight:700}
.big{font-size:28px;font-weight:800}.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px}
.neg{color:var(--er)}.pos{color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mu);font:12px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;min-width:56px}nav button span{font-size:22px}nav button.on{color:var(--pr);font-weight:700}
nav .plus{background:var(--pr);color:#fff;border-radius:50%;width:58px;height:58px;min-width:0;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px #0004}nav .plus span{font-size:30px}
button.p,button.s,button.d{border:0;border-radius:12px;padding:13px 16px;font:600 16px inherit;width:100%;margin-top:8px}button.p{background:var(--pr);color:#fff}button.s{background:var(--bd);color:var(--tx)}button.d{background:none;color:var(--er);border:1px solid var(--er)}
button.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font:16px inherit;margin:4px 0 10px}label{font-size:13px;color:var(--mu)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:9px 4px;font:14px inherit}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:8px 12px;font:14px inherit}.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.al{border-left:4px solid var(--wa);padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:14px}.al.g{border-color:var(--pr)}
#m,#k{position:fixed;inset:0;z-index:9;display:none}#m{background:#0007;align-items:flex-end}#m.on{display:flex}
#m .sh{background:var(--cd);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
#k{background:var(--bg);padding:30px 24px;text-align:center}#k.on{display:block}
.ft{background:var(--bd);color:var(--mu);font-size:13px;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.x{overflow-x:auto}
.top{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.bn{font-weight:800;font-size:17px}.by{background:var(--pr);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}.c{box-shadow:0 1px 3px #0001}.bar i{transition:width .5s}.hero{background:linear-gradient(135deg,#0f9d73,#0a6b50);color:#fff;border:0}.hero .m{color:#ffffffcc}.hero .neg{color:#ffd0d0}.hero .pos{color:#fff}
</style></head><body><div id="v"></div><div id="m"><div class="sh" id="sh"></div></div><div id="k"></div>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'-':'')+'₲ '+Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const num=v=>parseInt(String(v).replace(/\D/g,''))||0,pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=a=>a.reduce((s,x)=>s+x.amt,0),MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const BN={g:'GASTOS',s:'SALUD',o:'OCIO',r:'AHORRO / RESERVA'},BI={g:'🛒',s:'💊',o:'🎉',r:'🏦'},BC={g:'#0f9d73',s:'#3b82c4',o:'#a06ad6',r:'#d99a00'};
const DC={g:['Alimentación','Supermercado','Combustible','Transporte','Servicios','Vivienda','Educación','Otros'],s:['Medicamentos','Farmacia','Consultas','Estudios','Otros'],o:['Restaurantes','Salidas','Entretenimiento','Streaming','Compras personales','Otros'],r:['Emergencias','Ahorro','Objetivo específico','Otros']};
let rm='',S,view='home',sub='res',modal=null,locked=false,armed=null,hf={m:'',t:'',q:''},hid=0,db=null;
function def(){return{demo:false,set:{name:'',start:1,pct:{g:70,s:10,o:10,r:10},theme:'auto',alerts:true,lock:1,pin:null,salt:null,cats:JSON.parse(JSON.stringify(DC)),itypes:['Salario','Trabajo extra','Negocio','Venta','Comisión','Otros']},inc:[],exp:[],wd:[],goals:[],last:{b:'g',cat:'Alimentación'}}}
function seed(){const n=new Date(),t=n.getDate(),d=i=>iso(new Date(n.getFullYear(),n.getMonth(),Math.min(i,t))),s=def();s.demo=true;
s.inc=[{id:uid(),date:d(1),desc:'Salario',amt:5000000,type:'Salario',obs:''}];
const E=(i,amt,b,cat,desc,pay)=>({id:uid(),date:d(i),time:'12:00',amt,b,cat,desc,pay:pay||'Efectivo',obs:''});
s.exp=[E(2,650000,'g','Supermercado','Compra mensual','Tarjeta'),E(3,400000,'g','Combustible','Tanque'),E(5,480000,'g','Servicios','Luz y agua','Transferencia'),E(7,220000,'g','Alimentación','Almuerzos'),E(9,150000,'g','Transporte','Pasajes'),E(99,20000,'g','Alimentación','Almuerzo'),E(99,180000,'g','Otros','Varios'),E(4,90000,'s','Farmacia','Medicamentos'),E(6,60000,'s','Consultas','Consulta'),E(8,120000,'o','Restaurantes','Cena'),E(10,80000,'o','Streaming','Suscripción')];
s.goals=[{id:uid(),name:'✈️ Viaje',target:8000000,saved:5200000,date:''}];return s}
async function load(){try{db=await new Promise((r,j)=>{const q=indexedDB.open('misfinanzas',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=j});
S=await new Promise(r=>{const q=db.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){db=null}
if(!S)S=seed();save()}
function save(q){try{if(db)db.transaction('k','readwrite').objectStore('k').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){}if(!q&&S&&S.set.gauto&&S.set.gcid&&typeof gt!=='undefined'){clearTimeout(gt);gt=setTimeout(()=>gsync(false),15000)}}
function calc(m){const inc=sum(S.inc.filter(x=>pk(x.date)==m)),p=S.set.pct,b={g:Math.round(inc*p.g/100),s:Math.round(inc*p.s/100),o:Math.round(inc*p.o/100)};b.r=inc-b.g-b.s-b.o;
const u={g:0,s:0,o:0,r:0};S.exp.filter(x=>pk(x.date)==m).forEach(x=>u[x.b]+=x.amt);const wd=sum(S.wd.filter(x=>pk(x.date)==m));u.r=wd;
return{inc,b,u,wd,a:{g:b.g-u.g,s:b.s-u.s,o:b.o-u.o,r:b.r-u.r}}}
function months(){const s=new Set([pk(iso(new Date()))]);[...S.inc,...S.exp,...S.wd].forEach(x=>s.add(pk(x.date)));return[...s].sort()}
function totalR(){return months().reduce((a,m)=>a+calc(m).a.r,0)}
const mlabel=m=>MES[+m.slice(5)-1]+' '+m.slice(0,4)+((S&&S.set.start||1)>1?' (desde el '+S.set.start+')':'');
const brand=()=>'<div class="top"><span class="bn">💰 Mis Finanzas</span><span class="by">By CR</span></div>';
const pk=d=>{const D=(S&&S.set.start)||1,[y,m,dd]=d.split('-').map(Number);if(dd>=D)return d.slice(0,7);const p=new Date(y,m-2,1);return p.getFullYear()+'-'+pad(p.getMonth()+1)};
const per=m=>{const D=S.set.start||1,[y,o]=m.split('-').map(Number),a=new Date(y,o-1,D),b=new Date(y,o,D);return{a,b,dim:Math.round((b-a)/864e5)}};
const bar=(u,t,c)=>{const p=t>0?u/t*100:(u>0?100:0);return`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>=100?'var(--er)':c}"></i></div>`};
const pc=(u,t)=>t>0?Math.round(u/t*100):0;
function home(){const n=new Date(),T=iso(n),m=pk(T),c=calc(m),P=per(m),dim=P.dim,day=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-P.a)/864e5)+1,left=dim-day+1;
const tod=S.exp.filter(x=>x.date==T),tg=sum(tod.filter(x=>x.b=='g')),rec=Math.max(0,Math.round((c.a.g+tg)/left)),dif=rec-tg,spent=c.u.g+c.u.s+c.u.o,av=c.a.g+c.a.s+c.a.o;
const pr=c.u.g/day*dim,al=[];
if(S.set.alerts){if(c.b.g>0){if(pc(c.u.g,c.b.g)>=80&&left>=5)al.push(`⚠️ Ya usaste el ${pc(c.u.g,c.b.g)}% de tu presupuesto de gastos y faltan ${left-1} días para terminar el mes.`);else if(c.u.g>0&&pr<=c.b.g*.9)al.push('💚 Vas muy bien. Estás gastando menos que tu ritmo recomendado.');if(c.a.g<0)al.push('⚠️ Superaste tu presupuesto de gastos en '+money(-c.a.g)+'.')}
if(c.b.s>0&&pc(c.u.s,c.b.s)>=90)al.push(`💊 Has utilizado el ${pc(c.u.s,c.b.s)}% de tu presupuesto de salud.`);if(c.b.o>0&&c.u.o>=c.b.o)al.push('🎉 Has utilizado todo tu presupuesto de ocio.');if(c.inc>0&&c.wd==0&&left<=5)al.push('🏦 Este mes no necesitaste utilizar tu reserva. ¡Excelente!')}
let proj='';if(c.inc>0&&c.u.g>0){proj=pr>c.b.g?`⚠️ Atención: a tu ritmo actual gastarías unos ${money(pr)} de tu presupuesto de ${money(c.b.g)}.`:`Con tu ritmo actual terminarías el mes usando unos ${money(pr)} de ${money(c.b.g)} y te sobrarían unos ${money(c.b.g-pr)}.`}
const card=k=>{const lab=k=='g'?['Presupuesto','Gastado']:k=='r'?['Reservado','Retirado']:['Reservado','Utilizado'];return`<div class="c"><div class="r"><h2 style="margin:0">${BI[k]} ${BN[k]} — ${S.set.pct[k]}%</h2><span class="m">${pc(c.u[k],c.b[k])}%</span></div>${bar(c.u[k],c.b[k],BC[k])}
<div class="r"><span class="m">${lab[0]}</span><span>${money(c.b[k])}</span></div><div class="r"><span class="m">${lab[1]}</span><span>${money(c.u[k])}</span></div><div class="r"><span class="m">Disponible</span><span class="b ${c.a[k]<0?'neg':''}">${money(c.a[k])}</span></div>${k=='r'?`<div class="r"><span class="m">Ahorro acumulado total</span><span class="b pos">${money(totalR())}</span></div>`:''}</div>`};
return`${brand()}<h1>${S.set.name?'Hola, '+esc(S.set.name)+' 👋':'Inicio'} <span class="m">· ${mlabel(m)}</span></h1>
${S.demo?'<div class="ft">Estás viendo datos de demostración. Podés borrarlos en Ajustes → Restablecer datos de demostración.</div>':''}
<div class="c hero"><div class="m">Dinero disponible (sin reserva)</div><div class="big ${av<0?'neg':''}">${money(av)}</div><div class="r"><span class="m">Ingresos</span><span>${money(c.inc)}</span></div><div class="r"><span class="m">Gastado</span><span>${money(spent)}</span></div><div class="r"><span class="m">Restante</span><span class="b">${money(av)}</span></div></div>
${al.map(a=>`<div class="al ${a[0]=='💚'||a[0]=='🎉'||a[0]=='🏦'?'g':''}">${a}</div>`).join('')}
${card('g')}${card('s')}${card('o')}${card('r')}
<div class="c"><h2>📅 Hoy</h2><div class="r"><span class="m">Presupuesto diario recomendado</span><span class="b">${money(rec)}</span></div><div class="r"><span class="m">Gastado hoy (${tod.length} gastos)</span><span>${money(sum(tod))}</span></div><div class="r"><span class="m">${dif>=0?'Disponible según promedio':'Excedido hoy'}</span><span class="b ${dif<0?'neg':'pos'}">${money(Math.abs(dif))}</span></div><div class="m">${money(Math.max(0,c.a.g))} ÷ ${left} días restantes (incluye hoy)</div>${tod.map(row).join('')}</div>
${proj?`<div class="c"><h2>🔮 Proyección de fin de mes</h2>${proj}</div>`:''}`}
function mv(){return[...S.inc.map(x=>({...x,k:'i',lab:x.type})),...S.exp.map(x=>({...x,k:'e',lab:x.cat})),...S.wd.map(x=>({...x,k:'w',lab:'Retiro de reserva',desc:x.reason}))].sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')))}
function row(x){const e=x.k?x:{...x,k:'e',lab:x.cat},ic=e.k=='i'?'💰':e.k=='w'?'🏦':BI[e.b],sg=e.k=='i'?'+':'-';return`<div class="r" data-a="edit" data-k="${e.k}" data-id="${e.id}" style="border-top:1px solid var(--bd);padding:9px 0"><div><div>${ic} ${esc(e.desc||e.lab)}</div><div class="m">${esc(e.lab)} · ${e.date}</div></div><div class="b ${e.k=='i'?'pos':''}">${sg}${money(e.amt).replace('₲ ','₲ ')}</div></div>`}
function ana(){const tabs=`<div class="seg">${[['res','Resumen'],['his','Historial'],['yr','Mi año']].map(t=>`<button data-a="sub" data-v="${t[0]}" class="${sub==t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`;
if(sub=='res'){const ms=months(),m=rm&&ms.includes(rm)?rm:pk(iso(new Date())),c=calc(m),ct={};S.exp.filter(x=>pk(x.date)==m).forEach(x=>ct[x.cat]=(ct[x.cat]||0)+x.amt);const top=Object.entries(ct).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=top[0]?top[0][1]:1,last=ms.slice(-4);const mxm=Math.max(1,...last.map(k=>Math.max(calc(k).inc,calc(k).u.g+calc(k).u.s+calc(k).u.o)));
const L=(a,b,cl)=>`<div class="r"><span class="m">${a}</span><span class="b ${cl||''}">${b}</span></div>`;
return`<h1>Análisis</h1>${tabs}<select id="rm">${ms.slice().reverse().map(k=>`<option value="${k}" ${k==m?'selected':''}>${mlabel(k)}</option>`).join('')}</select><div class="c"><h2>Resumen de ${mlabel(m)}</h2>${L('Ingresos',money(c.inc))}${L('Gastos',money(c.u.g))}${L('Salud',money(c.u.s))}${L('Ocio',money(c.u.o))}${L('Ahorro (reservado)',money(c.b.r))}${L('Retirado de la reserva',money(c.wd))}${L('% de ingresos ahorrado',pc(c.b.r-c.wd,c.inc)+'%')}${L('Saldo disponible',money(c.a.g+c.a.s+c.a.o),c.a.g+c.a.s+c.a.o<0?'neg':'pos')}</div>
<div class="c"><h2>Dónde más gastaste</h2>${top.length?top.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><span>${money(v)}</span></div>${bar(v,mx,'var(--pr)')}`).join(''):'<span class="m">Sin gastos este mes.</span>'}</div>
<div class="c"><h2>Comparación con meses anteriores</h2>${last.map(k=>{const q=calc(k),g=q.u.g+q.u.s+q.u.o;return`<div class="m" style="margin-top:6px">${mlabel(k)}</div>${bar(q.inc,mxm,'#3b82c4')}<div class="r m"><span>Ingresos ${money(q.inc)}</span></div>${bar(g,mxm,'var(--wa)')}<div class="r m"><span>Gastos ${money(g)}</span></div>`}).join('')}</div><button class="p" data-a="pdf">📄 Generar PDF del mes</button>`}
if(sub=='his'){const ms=months().reverse(),l=mv().filter(x=>(!hf.m||pk(x.date)==hf.m)&&(!hf.t||(hf.t=='i'?x.k=='i':hf.t=='w'?x.k=='w':hf.t=='e'?x.k=='e':x.b==hf.t))&&(!hf.q||(x.desc+' '+x.lab).toLowerCase().includes(hf.q.toLowerCase())));
return`<h1>Historial</h1>${tabs}<input id="hq" placeholder="🔍 Buscar por descripción" value="${esc(hf.q)}"><div style="display:flex;gap:8px"><select id="hm"><option value="">Todos los meses</option>${ms.map(k=>`<option value="${k}" ${hf.m==k?'selected':''}>${mlabel(k)}</option>`).join('')}</select><select id="ht">${[['','Todo'],['i','Ingresos'],['e','Gastos'],['g','Gastos esenciales'],['s','Salud'],['o','Ocio'],['w','Retiros ahorro']].map(o=>`<option value="${o[0]}" ${hf.t==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class="c">${l.length?l.slice(0,200).map(row).join(''):'<span class="m">Sin movimientos.</span>'}</div>`}
const y=new Date().getFullYear(),ms=[...Array(12)].map((_,i)=>y+'-'+pad(i+1)),cs=ms.map(calc);let cum=0;const tot=f=>cs.reduce((a,c)=>a+f(c),0),sp=cs.map(c=>c.u.g+c.u.s+c.u.o),act=sp.map((v,i)=>[v,i]).filter(x=>x[0]>0);
const mxs=act.length?act.reduce((a,b)=>b[0]>a[0]?b:a):null,mns=act.length?act.reduce((a,b)=>b[0]<a[0]?b:a):null,L=(a,b)=>`<div class="r"><span class="m">${a}</span><span class="b">${b}</span></div>`,ev=cs.map(c=>cum+=c.a.r),mxe=Math.max(1,...ev.map(Math.abs));
return`<h1>Mi año ${y}</h1>${tabs}<div class="c">${L('Ingresos totales',money(tot(c=>c.inc)))}${L('Gastos totales',money(tot(c=>c.u.g)))}${L('Destinado a salud',money(tot(c=>c.b.s)))}${L('Destinado a ocio',money(tot(c=>c.b.o)))}${L('Total ahorrado',money(tot(c=>c.b.r)))}${L('Retirado del ahorro',money(tot(c=>c.wd)))}${L('Ahorro neto',money(tot(c=>c.a.r)))}${L('Mes de mayor gasto',mxs?MES[mxs[1]]+' ('+money(mxs[0])+')':'—')}${L('Mes de menor gasto',mns?MES[mns[1]]+' ('+money(mns[0])+')':'—')}</div><div class="c"><h2>Evolución del ahorro</h2>${ev.map((v,i)=>cs[i].inc||cs[i].wd?`<div class="r m"><span>${MES[i]}</span><span>${money(v)}</span></div>${bar(Math.max(0,v),mxe,'var(--wa)')}`:'').join('')||'<span class="m">Sin datos.</span>'}</div>`}
function goals(){return`<h1>Mis metas</h1>${S.goals.map(g=>{const p=pc(g.saved,g.target);return`<div class="c"><div class="r"><span class="b">${esc(g.name)}</span><span class="m" data-a="edit" data-k="m" data-id="${g.id}">✏️ editar</span></div><div class="m">Meta: ${money(g.target)}${g.date?' · hasta '+g.date:''}</div><div class="r"><span>Ahorrado: ${money(g.saved)}</span><span class="b">${p}%</span></div>${bar(g.saved,g.target,'var(--pr)')}<button class="s sm" data-a="contrib" data-id="${g.id}">+ Aportar</button></div>`}).join('')||'<div class="c m">Aún no tenés metas.</div>'}<button class="p" data-a="newgoal">+ Nueva meta</button><div class="ft" style="margin-top:12px">Las metas son un registro aparte: tu reserva total es ${money(totalR())}.</div>`}

let gtok=null,gexp=0,gbusy=false,gt=0;const GN='misfinanzas-respaldo.json';
function gload(){return new Promise((ok,no)=>{if(window.google&&google.accounts)return ok();const x=document.createElement('script');x.src='https://accounts.google.com/gsi/client';x.onload=ok;x.onerror=no;document.head.appendChild(x)})}
async function gtoken(man){await gload();return new Promise((ok,no)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.set.gcid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:q=>{if(q.access_token){gtok=q.access_token;gexp=Date.now()+(q.expires_in-60)*1000;ok(gtok)}else no(q)},error_callback:no});c.requestAccessToken({prompt:man?'':'none'})})}
async function gfind(t){const q=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appdata&fields=files(id)&q='+encodeURIComponent("name='"+GN+"'"),{headers:{Authorization:'Bearer '+t}});if(!q.ok)throw 0;const j=await q.json();return j.files&&j.files[0]?j.files[0].id:null}
async function gsync(man){if(!S.set.gcid||gbusy)return;if(!navigator.onLine){if(man)toast('Sin conexión');return}gbusy=true;try{const t=gtok&&Date.now()<gexp?gtok:await gtoken(man),c=JSON.stringify({app:'misfinanzas',v:1,date:new Date().toISOString(),data:{...S,set:{...S.set,pin:null,salt:null,bio:null,gcid:null}}}),id=await gfind(t),b='cr'+uid(),H={Authorization:'Bearer '+t};let q;
if(id)q=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:c});
else q=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{...H,'Content-Type':'multipart/related; boundary='+b},body:'--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name:GN,parents:['appdata']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+c+'\r\n--'+b+'--'});
if(!q.ok)throw new Error('HTTP '+q.status);S.set.glast=new Date().toISOString();S.set.gerr='';save(true);if(man)toast('Respaldo en Drive ✓')}catch(e){S.set.gerr=man?'No se pudo respaldar. Revisá el ID de cliente y el origen autorizado':'Pendiente: tocá “Conectar y respaldar ahora”';save(true);if(man)toast('Falló el respaldo en Drive')}finally{gbusy=false;if(view=='set'&&!modal&&document.activeElement.tagName!='INPUT')paint()}}
async function gres(){armed=null;try{const t=gtok&&Date.now()<gexp?gtok:await gtoken(true),id=await gfind(t);if(!id){toast('Todavía no hay respaldo en Drive');return paint()}const q=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:{Authorization:'Bearer '+t}}),o=await q.json(),n=o.data;if(!n||!n.set||!n.inc||!n.exp)throw 0;const k=S.set;n.set={...n.set,pin:k.pin,salt:k.salt,bio:k.bio,gcid:k.gcid,gauto:k.gauto,glast:k.glast};S=n;save(true);paint();toast('Restaurado desde Drive ✓')}catch(e){toast('No se pudo restaurar desde Drive');paint()}}
